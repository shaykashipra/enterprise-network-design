<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="950" viewBox="0 0 1500 950">
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .site { fill: #ffffff; stroke: #c9d1df; stroke-width: 2; }
      .device { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 8; }
      .pc { fill: #e8f3ff; stroke: #2563eb; stroke-width: 2; rx: 8; }
      .switch { fill: #ecfdf3; stroke: #15803d; stroke-width: 2; rx: 8; }
      .router { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 8; }
      .server { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; rx: 8; }
      .title { font-family: Arial, sans-serif; font-size: 28px; font-weight: 700; fill: #0f172a; }
      .section { font-family: Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #1e293b; }
      .label { font-family: Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .small { font-family: Arial, sans-serif; font-size: 13px; fill: #334155; }
      .tiny { font-family: Arial, sans-serif; font-size: 12px; fill: #475569; }
      .vlan { font-family: Arial, sans-serif; font-size: 12px; fill: #1d4ed8; font-weight: 700; }
      .line { stroke: #1f2937; stroke-width: 2.5; fill: none; }
      .trunk { stroke: #15803d; stroke-width: 4; fill: none; }
      .wan { stroke: #c2410c; stroke-width: 3.5; fill: none; stroke-dasharray: 8 6; }
      .note { fill: #fff; stroke: #94a3b8; stroke-width: 1.5; rx: 8; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1500" height="950"/>
  <text class="title" x="750" y="45" text-anchor="middle">Enterprise Network Design - Packet Tracer Wiring Diagram</text>
  <text class="small" x="750" y="72" text-anchor="middle">Use this as the visual guide when arranging devices in Cisco Packet Tracer</text>

  <rect class="site" x="45" y="105" width="600" height="650" rx="14"/>
  <text class="section" x="345" y="135" text-anchor="middle">HEAD OFFICE</text>

  <rect class="pc" x="80" y="175" width="125" height="62"/>
  <text class="label" x="142" y="201" text-anchor="middle">HR-PC</text>
  <text class="vlan" x="142" y="221" text-anchor="middle">VLAN 10</text>

  <rect class="pc" x="80" y="260" width="125" height="62"/>
  <text class="label" x="142" y="286" text-anchor="middle">FIN-PC</text>
  <text class="vlan" x="142" y="306" text-anchor="middle">VLAN 20</text>

  <rect class="pc" x="80" y="345" width="125" height="62"/>
  <text class="label" x="142" y="371" text-anchor="middle">IT-PC</text>
  <text class="vlan" x="142" y="391" text-anchor="middle">VLAN 30</text>

  <rect class="pc" x="80" y="430" width="125" height="62"/>
  <text class="label" x="142" y="456" text-anchor="middle">SALES-PC</text>
  <text class="vlan" x="142" y="476" text-anchor="middle">VLAN 40</text>

  <rect class="server" x="80" y="515" width="125" height="62"/>
  <text class="label" x="142" y="541" text-anchor="middle">SERVER1</text>
  <text class="vlan" x="142" y="561" text-anchor="middle">VLAN 60</text>

  <rect class="switch" x="285" y="285" width="150" height="135"/>
  <text class="label" x="360" y="327" text-anchor="middle">ASW-HQ</text>
  <text class="small" x="360" y="350" text-anchor="middle">Cisco 2960</text>
  <text class="tiny" x="360" y="374" text-anchor="middle">Access Switch</text>

  <line class="line" x1="205" y1="206" x2="285" y2="315"/>
  <text class="tiny" x="214" y="245">PC F0 - SW Fa0/1</text>
  <line class="line" x1="205" y1="291" x2="285" y2="335"/>
  <text class="tiny" x="214" y="307">PC F0 - SW Fa0/2</text>
  <line class="line" x1="205" y1="376" x2="285" y2="355"/>
  <text class="tiny" x="214" y="375">PC F0 - SW Fa0/3</text>
  <line class="line" x1="205" y1="461" x2="285" y2="375"/>
  <text class="tiny" x="214" y="439">PC F0 - SW Fa0/4</text>
  <line class="line" x1="205" y1="546" x2="285" y2="395"/>
  <text class="tiny" x="214" y="502">PC F0 - SW Fa0/5</text>

  <rect class="switch" x="495" y="285" width="150" height="135"/>
  <text class="label" x="570" y="321" text-anchor="middle">CORE-HQ</text>
  <text class="small" x="570" y="344" text-anchor="middle">Cisco 3560</text>
  <text class="tiny" x="570" y="366" text-anchor="middle">Layer-3 Core</text>
  <text class="tiny" x="570" y="386" text-anchor="middle">SVI gateways + DHCP</text>

  <line class="trunk" x1="435" y1="352" x2="495" y2="352"/>
  <text class="small" x="465" y="334" text-anchor="middle">TRUNK</text>
  <text class="tiny" x="465" y="374" text-anchor="middle">ASW Fa0/24 - CORE Fa0/1</text>

  <rect class="router" x="495" y="535" width="150" height="95"/>
  <text class="label" x="570" y="572" text-anchor="middle">R-HQ</text>
  <text class="small" x="570" y="594" text-anchor="middle">Cisco 2911</text>
  <text class="tiny" x="570" y="614" text-anchor="middle">HQ WAN Edge</text>

  <line class="line" x1="570" y1="420" x2="570" y2="535"/>
  <text class="tiny" x="585" y="477">CORE Gi0/1 - R-HQ Gi0/0</text>
  <text class="tiny" x="585" y="496">10.10.99.0/30</text>

  <rect class="site" x="735" y="105" width="350" height="650" rx="14"/>
  <text class="section" x="910" y="135" text-anchor="middle">PROVIDER / WAN</text>

  <rect class="router" x="835" y="415" width="150" height="105"/>
  <text class="label" x="910" y="454" text-anchor="middle">R-ISP</text>
  <text class="small" x="910" y="477" text-anchor="middle">Cisco 2911</text>
  <text class="tiny" x="910" y="498" text-anchor="middle">Simulated WAN</text>

  <path class="wan" d="M645 582 C700 582, 765 480, 835 468"/>
  <text class="tiny" x="705" y="535">R-HQ Gi0/1 - R-ISP Gi0/0</text>
  <text class="tiny" x="735" y="555">10.10.250.0/30</text>

  <rect class="site" x="1145" y="105" width="305" height="305" rx="14"/>
  <text class="section" x="1298" y="135" text-anchor="middle">BRANCH 1</text>

  <rect class="router" x="1220" y="175" width="155" height="85"/>
  <text class="label" x="1298" y="209" text-anchor="middle">R-BR1</text>
  <text class="small" x="1298" y="231" text-anchor="middle">Cisco 2911</text>

  <rect class="switch" x="1220" y="295" width="155" height="70"/>
  <text class="label" x="1298" y="323" text-anchor="middle">ASW-BR1</text>
  <text class="small" x="1298" y="345" text-anchor="middle">Cisco 2960</text>

  <rect class="pc" x="1220" y="450" width="155" height="65"/>
  <text class="label" x="1298" y="477" text-anchor="middle">BR1-PC</text>
  <text class="vlan" x="1298" y="497" text-anchor="middle">10.10.110.0/24</text>

  <path class="wan" d="M985 450 C1060 390, 1130 250, 1220 218"/>
  <text class="tiny" x="1045" y="330">R-ISP Gi0/1 - R-BR1 Gi0/0</text>
  <text class="tiny" x="1075" y="350">10.10.250.4/30</text>

  <line class="line" x1="1298" y1="260" x2="1298" y2="295"/>
  <text class="tiny" x="1312" y="281">R-BR1 Gi0/1 - ASW Fa0/24</text>

  <line class="line" x1="1298" y1="365" x2="1298" y2="450"/>
  <text class="tiny" x="1312" y="414">BR1-PC F0 - ASW Fa0/1</text>

  <rect class="site" x="1145" y="505" width="305" height="330" rx="14"/>
  <text class="section" x="1298" y="535" text-anchor="middle">BRANCH 2</text>

  <rect class="router" x="1220" y="575" width="155" height="85"/>
  <text class="label" x="1298" y="609" text-anchor="middle">R-BR2</text>
  <text class="small" x="1298" y="631" text-anchor="middle">Cisco 2911</text>

  <rect class="switch" x="1220" y="695" width="155" height="70"/>
  <text class="label" x="1298" y="723" text-anchor="middle">ASW-BR2</text>
  <text class="small" x="1298" y="745" text-anchor="middle">Cisco 2960</text>

  <rect class="pc" x="1220" y="800" width="155" height="65"/>
  <text class="label" x="1298" y="827" text-anchor="middle">BR2-PC</text>
  <text class="vlan" x="1298" y="847" text-anchor="middle">10.10.120.0/24</text>

  <path class="wan" d="M985 490 C1060 550, 1130 610, 1220 618"/>
  <text class="tiny" x="1048" y="595">R-ISP Gi0/2 - R-BR2 Gi0/0</text>
  <text class="tiny" x="1080" y="615">10.10.250.8/30</text>

  <line class="line" x1="1298" y1="660" x2="1298" y2="695"/>
  <text class="tiny" x="1312" y="681">R-BR2 Gi0/1 - ASW Fa0/24</text>

  <line class="line" x1="1298" y1="765" x2="1298" y2="800"/>
  <text class="tiny" x="1312" y="789">BR2-PC F0 - ASW Fa0/1</text>

  <rect class="note" x="70" y="790" width="665" height="115"/>
  <text class="label" x="92" y="818">Important Packet Tracer notes</text>
  <text class="small" x="92" y="845">1. Use Copper Straight-Through for all links. Auto-Connect is also acceptable.</text>
  <text class="small" x="92" y="868">2. If R-ISP has no Gi0/2, add a router Ethernet module or use an available interface and adjust config.</text>
  <text class="small" x="92" y="891">3. The green trunk link carries VLANs 10, 20, 30, 40, 50, and 60.</text>

  <rect class="note" x="770" y="790" width="320" height="115"/>
  <text class="label" x="792" y="818">Implemented vs Conceptual</text>
  <text class="small" x="792" y="845">Implemented: VLAN, trunk, SVI, DHCP, OSPF, ACL, WAN.</text>
  <text class="small" x="792" y="872">Conceptual: full MPLS PE/P/LDP/MPLS VPN.</text>
</svg>
